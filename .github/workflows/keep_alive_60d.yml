name: Keep Alive - Prevent 60-Day Workflow Disable

on:
  schedule:
    # Berjalan setiap 1 haribulan & 15 haribulan jam 3:00 Pagi MYT (19:00 UTC)
    - cron: "0 19 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keep-repo-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. Checkout Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Jalankan Heartbeat & Auto-Enable Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/keep_alive_workflows.py

      - name: 3. Auto-Commit Heartbeat ke Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): 14-day keep-alive heartbeat [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
            echo "✅ Heartbeat berjaya ditolak ke GitHub!"
          fi