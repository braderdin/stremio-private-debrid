name: X10 HTTP Stream List Engine

on:
  workflow_dispatch:
    inputs:
      imdb_id:
        description: "Target IMDb ID (cth: tt15327088 atau tt0944947:1:1)"
        required: true
        type: string
      title:
        description: "Tajuk sandaran siri/filem"
        required: false
        default: ""
        type: string

concurrency:
  group: http-list-${{ inputs.imdb_id }}
  cancel-in-progress: true

jobs:
  scrape-http-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Nyahsekat DNS Runner
        run: |
          sudo sed -i '1inameserver 1.1.1.1\nnameserver 8.8.8.8' /etc/resolv.conf

      - name: 2. Checkout Repositori
        uses: actions/checkout@v7

      - name: 3. Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 4. Pasang Keperluan Pustaka Python
        run: |
          pip install --upgrade pip
          pip install -r requirements-runner.txt

      - name: 5. Laksanakan Enjin X10_pengu_http_lister.py
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
          PENGU_PLAY_TOKEN: ${{ secrets.PENGU_PLAY_TOKEN }}
        run: |
          python live_engine_v3/X10_pengu_http_lister.py \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

      - name: 6. Hantar Notifikasi Senarai ke Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "list" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"