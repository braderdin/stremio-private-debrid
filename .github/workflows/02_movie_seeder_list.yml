name: 02 Movie Seeder List Engine

on:
  workflow_dispatch:
    inputs:
      imdb_id:
        description: "Target IMDb ID (cth: tt1204977)"
        required: true
        type: string
      title:
        description: "Tajuk sandaran filem"
        required: false
        default: ""
        type: string

concurrency:
  group: seeder-list-${{ inputs.imdb_id }}
  cancel-in-progress: true

jobs:
  scrape-and-cache-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repositori
        uses: actions/checkout@v4

      - name: 2. Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Pasang Keperluan Pustaka Python
        run: |
          pip install --upgrade pip
          pip install -r requirements-runner.txt

      - name: 4. Picu Pengikis Sarikata di Repo Subtitle (Async)
        continue-on-error: true
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/braderdin/stremio-sub-addon/dispatches \
            -d '{"event_type":"ondemand_scrape","client_payload":{"imdb_id":"${{ inputs.imdb_id }}"}}'

      - name: 5. Laksanakan Enjin 02_seeder_lister.py
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v2/02_seeder_lister.py \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

      - name: 6. Hantar Notifikasi Senarai Seeder ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "list" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"
    
      - name: 7. Hantar Notifikasi Ralat ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "error" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}" \
            --workflow "02_movie_seeder_list.yml" \
            --error "Gagal mengekstrak atau menyimpan senarai seeder ke Redis."