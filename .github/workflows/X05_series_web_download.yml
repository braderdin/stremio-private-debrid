name: X05 Series Web Scrape Stremio Engine

on:
  workflow_dispatch:
    inputs:
      imdb_id:
        description: "IMDb identifier (cth: tt0097576 atau tt0944947:1:1)"
        required: true
        type: string
      title:
        description: "Tajuk video daripada Stremio"
        required: false
        default: "Video"
        type: string
      force:
        description: "Paksa muat turun semula (true/false)"
        required: false
        default: "false"
        type: string

concurrency:
  group: webscrape-${{ inputs.imdb_id }}
  cancel-in-progress: false

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 1. Nyahsekat DNS Runner (Guna Cloudflare 1.1.1.1 & Google 8.8.8.8)
        run: |
          sudo sed -i '1inameserver 1.1.1.1\nnameserver 8.8.8.8' /etc/resolv.conf
          head -n 4 /etc/resolv.conf

      - name: 2. Peruntukan Ruang SSD Runner (Kosongkan ~25GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          df -h

      - name: 3. Checkout Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 4. Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 5. Pasang Perkakas Rclone & Verifikasi FFmpeg
        run: |
          ffmpeg -version | head -n 1
          curl https://rclone.org/install.sh | sudo bash

      - name: 6. Pasang Pustaka Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 7. Sediakan Cache & Binari Pelayar Camoufox
        id: cache-camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 8. Muat Turun Binari Pelayar Camoufox
        run: |
          python -m camoufox fetch

      - name: 9. Hantar Notifikasi Mula Tugasan ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python python_scrape/X06_telegram_scrape_notify.py \
            --mode "start" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

      - name: 10. Laksanakan Enjin Scraper Utama (X06_scrape_runner.py)
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
          B2_ACCOUNTS_JSON: ${{ secrets.B2_ACCOUNTS_JSON }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          CF_WORKER_B2_PROXY_STORAGE: "https://b2-proxy-aria-engine.retrogamerg405v.workers.dev"
          BROWSER_HEADLESS: "true"
        run: |
          FORCE_ARG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python python_scrape/X06_scrape_runner.py \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}" $FORCE_ARG

      - name: 11. Segerak & Commit Pangkalan Data SQLite (Auto-Rebase Safe)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Gabungkan WAL ke fail utama SQLite sebelum staging
          python3 -c "import sqlite3, glob; [sqlite3.connect(f).execute('PRAGMA wal_checkpoint(TRUNCATE);').close() for f in glob.glob('python_scrape/data/*.db')]" 2>/dev/null || true

          git add python_scrape/data/*.db 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "db: update scrape_media sqlite shards [skip ci]"
            for i in {1..3}; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin main; then
                  echo "✅ Berjaya segerakkan rekod SQLite ke GitHub!"
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-rebase -X ours --no-edit
                if git push origin main; then
                  echo "✅ Berjaya merge & push rekod SQLite!"
                  exit 0
                fi
              fi
              sleep 2
            done
          fi

      - name: 12. Hantar Notifikasi Selesai ke Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python python_scrape/X06_telegram_scrape_notify.py \
            --mode "download" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

      - name: 13. Hantar Notifikasi Ralat ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python python_scrape/X06_telegram_scrape_notify.py \
            --mode "error" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}" \
            --workflow "X05_series_web_download.yml" \
            --error "Kegagalan semasa navigasi, pintasan media, atau muat naik B2."