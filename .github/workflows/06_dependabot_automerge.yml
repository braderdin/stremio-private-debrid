name: 06 Auto Merge Dependabot Updates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-guardian:
    runs-on: ubuntu-latest
    # Hanya berjalan jika Pull Request dibuat oleh bot Dependabot
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: 📥 Checkout Kode Sumber
        uses: actions/checkout@v7

      - name: 🔍 Ekstrak Metadata Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: 🐍 Pasang Python Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Pasang Dependensi Proyek
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧪 Uji Integritas Sintaks Kode (Smoke Test)
        run: |
          echo "Memeriksa sintaks skrip enjin aktif..."
          python -m py_compile live_engine/*.py || exit 1
          if [ -d live_engine/experiments ]; then
            python -m py_compile live_engine/experiments/*.py || exit 1
          fi
          echo "✅ Semua skrip lolos uji kompilasi sintaks tanpa kesalahan."

      - name: 🤖 Auto-Merge (Hanya Minor & Patch)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pembaruan Minor/Patch terdeteksi. Menyetujui dan menggabungkan PR..."
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"

      - name: ⚠️ Peringatan Pembaruan Major (Perlu Tinjauan Manual)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major Update Terdeteksi!** Alur kerja ini tidak menggabungkan versi major secara otomatis untuk menjaga kompatibilitas enjin. Silakan tinjau perubahan kode (*breaking changes*) secara manual sebelum merge."