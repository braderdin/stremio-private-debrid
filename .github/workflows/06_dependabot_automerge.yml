name: 06 Auto Merge Dependabot Updates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-guardian:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: 📥 Checkout Kod Sumber
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: 🔍 Ekstrak Metadata Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: 🐍 Pasang Python Runner
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔄 Selaraskan Versi ke requirements-runner & requirements-render
        run: |
          echo "Menyemak dan menyelaraskan versi pakej merentas 3 fail..."
          python -c "
          import re
          from pathlib import Path

          def parse_requirements(path):
              if not path.exists():
                  return {}
              data = {}
              for line in path.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if line and not line.startswith('#'):
                      m = re.match(r'^([a-zA-Z0-9_\-\[\]]+)([=><~].*)', line)
                      if m:
                          pkg_raw, ver = m.group(1), m.group(2)
                          pkg_clean = re.sub(r'\[.*\]', '', pkg_raw).lower().replace('_', '-')
                          data[pkg_clean] = ver
              return data

          base_reqs = parse_requirements(Path('requirements.txt'))

          for target_name in ['requirements-runner.txt', 'requirements-render.txt']:
              target_file = Path(target_name)
              if not target_file.exists():
                  continue
              lines = target_file.read_text(encoding='utf-8').splitlines()
              updated_lines = []
              for line in lines:
                  stripped = line.strip()
                  if stripped and not stripped.startswith('#'):
                      m = re.match(r'^([a-zA-Z0-9_\-\[\]]+)([=><~].*)', stripped)
                      if m:
                          pkg_raw = m.group(1)
                          pkg_clean = re.sub(r'\[.*\]', '', pkg_raw).lower().replace('_', '-')
                          if pkg_clean in base_reqs:
                              # Samakan versi mengikut requirements.txt
                              new_ver = base_reqs[pkg_clean]
                              updated_lines.append(f'{pkg_raw}{new_ver}')
                              continue
                  updated_lines.append(line)
              target_file.write_text('\n'.join(updated_lines) + '\n', encoding='utf-8')
          "

          # Commit semula fail runner dan render jika berlaku penyelarasan versi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements-runner.txt requirements-render.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync package versions with requirements.txt"
            git push
          fi

      - name: 📦 Pasang Keperluan Pustaka
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧪 Ujian Validasi Kod & Integriti Sintaks (Smoke Test)
        run: |
          echo "Memeriksa sintaks skrip enjin utama..."
          python -m py_compile live_engine/*.py || exit 1
          if [ -d live_engine/experiments ]; then
            python -m py_compile live_engine/experiments/*.py || exit 1
          fi
          echo "✅ Kesemua skrip melepasi pemeriksaan sintaks tanpa ralat."

      - name: 🤖 Auto-Merge (Hanya Minor & Patch)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Kemas kini jenis Minor/Patch dikesan. Menggabungkan PR secara automatik..."
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"

      - name: ⚠️ Amaran Major Update (Perlu Semakan Manual)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major Update Dikesan!** Alur kerja ini tidak menggabungkan kemas kini major secara automatik untuk melindungi kestabilan enjin. Sila semak perubahan kod (*breaking changes*) secara manual sebelum merge."