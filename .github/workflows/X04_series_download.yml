name: X04 Series Stremio Debrid Engine

on:
  workflow_dispatch:
    inputs:
      info_hash:
        description: "Torrent InfoHash Hex String atau 'AUTO'"
        required: true
        type: string
      imdb_id:
        description: "IMDb identifier (cth: tt0944947:1:1 atau tt0111161)"
        required: true
        type: string
      file_idx:
        description: "Indeks fail video di dalam torrent"
        required: false
        default: "0"
        type: string
      title:
        description: "Tajuk video atau nama pelepasan"
        required: false
        default: "Video"
        type: string

concurrency:
  group: debrid-${{ inputs.info_hash }}-${{ inputs.imdb_id }}
  cancel-in-progress: false

jobs:
  download-and-cache-series:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 1. Nyahsekat DNS Runner (Guna Cloudflare 1.1.1.1 & Google 8.8.8.8)
        run: |
          sudo sed -i '1inameserver 1.1.1.1\nnameserver 8.8.8.8' /etc/resolv.conf
          head -n 4 /etc/resolv.conf

      - name: 2. Peruntukan Ruang SSD Runner (Kosongkan ~25GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          df -h

      - name: 3. Checkout Repositori
        uses: actions/checkout@v4

      - name: 4. Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 5. Pasang Perkakas aria2c & rclone
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl
          curl https://rclone.org/install.sh | sudo bash

      - name: 6. Pasang Keperluan Pustaka Python
        run: |
          pip install --upgrade pip
          pip install -r requirements-runner.txt

      - name: 7. Laksanakan Enjin Runner X04
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
          B2_ACCOUNTS_JSON: ${{ secrets.B2_ACCOUNTS_JSON }}
          CF_WORKER_B2_PROXY_STORAGE: "https://b2-proxy-aria-engine.retrogamerg405v.workers.dev"
        run: |
          python live_engine_v3/X04_series_runner_core.py \
            --hash "${{ inputs.info_hash }}" \
            --imdb "${{ inputs.imdb_id }}" \
            --idx "${{ inputs.file_idx }}" \
            --title "${{ inputs.title }}"

      - name: 8. Hantar Notifikasi Selesai Muat Turun ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "download" \
            --imdb "${{ inputs.imdb_id }}" \
            --hash "${{ inputs.info_hash }}" \
            --title "${{ inputs.title }}"

      - name: 9. Hantar Notifikasi Ralat ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "error" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}" \
            --workflow "X04_series_download.yml" \
            --error "Proses aria2c muat turun siri atau pemindahan ke storan B2 gagal."