name: X11 HTTP Download to B2 Engine

on:
  workflow_dispatch:
    inputs:
      info_hash:
        description: "Pseudo-Hash Strim HTTP (40-hex)"
        required: true
        type: string
      imdb_id:
        description: "IMDb identifier (cth: tt15327088)"
        required: true
        type: string
      title:
        description: "Tajuk video atau pelepasan"
        required: false
        default: "Video"
        type: string

concurrency:
  group: http-download-${{ inputs.info_hash }}-${{ inputs.imdb_id }}
  cancel-in-progress: false

jobs:
  download-and-upload-http:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 1. Nyahsekat DNS Runner (Guna Cloudflare 1.1.1.1 & Google 8.8.8.8)
        run: |
          sudo sed -i '1inameserver 1.1.1.1\nnameserver 8.8.8.8' /etc/resolv.conf
          head -n 4 /etc/resolv.conf

      - name: 2. Peruntukan Ruang SSD Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 3. Checkout Repositori
        uses: actions/checkout@v7

      - name: 4. Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 5. Pasang Perkakas aria2c, rclone & ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 curl ffmpeg
          curl https://rclone.org/install.sh | sudo bash

      - name: 6. Pasang Keperluan Pustaka Python
        run: |
          pip install --upgrade pip
          pip install -r requirements-runner.txt

      - name: 6b. Pra-Pemeriksaan & Pengosongan Storan B2 (X07 Storage Guard)
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
          B2_ACCOUNTS_JSON: ${{ secrets.B2_ACCOUNTS_JSON }}
        run: |
          python live_engine_v3/X07_b2_storage_guard.py \
            --min-free-gb 7.0 \
            --safe-cap-gb 9.0

      - name: 6c. Pengesahan Penuh & Double-Check Storan B2 (X08 Smart Guard)
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
          B2_ACCOUNTS_JSON: ${{ secrets.B2_ACCOUNTS_JSON }}
        run: |
          python live_engine_v3/X08_b2_smart_storage_guard.py \
            --min-free-gb 7.0 \
            --safe-cap-gb 9.0 \
            --max-evict 15

      - name: 7. Laksanakan Enjin Runner X11 (Direct HTTP MP4 & DASH/HLS)
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
          B2_ACCOUNTS_JSON: ${{ secrets.B2_ACCOUNTS_JSON }}
          CF_WORKER_B2_PROXY_STORAGE: "https://b2-proxy-aria-engine.retrogamerg405v.workers.dev"
        run: |
          python live_engine_v3/X11_http_runner_core.py \
            --hash "${{ inputs.info_hash }}" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

      - name: 8. Hantar Notifikasi Selesai ke Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "download" \
            --imdb "${{ inputs.imdb_id }}" \
            --hash "${{ inputs.info_hash }}" \
            --title "${{ inputs.title }}"

      - name: 9. Hantar Notifikasi Ralat ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "error" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}" \
            --workflow "X11_http_download.yml" \
            --error "Proses muat turun strim HTTP ke storan B2 gagal."