name: X03 Series Seeder List Engine

on:
  workflow_dispatch:
    inputs:
      imdb_id:
        description: "Target IMDb ID (cth: tt0944947:1:1 atau tt0078748)"
        required: true
        type: string
      title:
        description: "Tajuk sandaran siri/filem"
        required: false
        default: ""
        type: string

concurrency:
  group: seeder-list-${{ inputs.imdb_id }}
  cancel-in-progress: true

jobs:
  scrape-and-cache-series-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Nyahsekat DNS Runner (Guna Cloudflare 1.1.1.1 & Google 8.8.8.8)
        run: |
          sudo sed -i '1inameserver 1.1.1.1\nnameserver 8.8.8.8' /etc/resolv.conf
          head -n 4 /etc/resolv.conf

      - name: 2. Checkout Repositori
        uses: actions/checkout@v7

      - name: 3. Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 4. Pasang Keperluan Pustaka Python
        run: |
          pip install --upgrade pip
          pip install -r requirements-runner.txt
          pip install guessit

      - name: 5. Picu Pengikis Sarikata di Repo Subtitle (Async)
        continue-on-error: true
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/braderdin/stremio-sub-addon/dispatches \
            -d '{"event_type":"ondemand_scrape","client_payload":{"imdb_id":"${{ inputs.imdb_id }}"}}'

      - name: 6. Laksanakan Enjin X03_series_seeder_lister.py
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v3/X03_series_seeder_lister.py \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

      - name: 7. Laksanakan Enjin Tambahan X06_seeder_multisource_lister.py (Multi-Source)
        continue-on-error: true
        env:
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v3/X06_seeder_multisource_lister.py \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

# =========================================================================
      # LANGKAH 7a: DAPATKAN TAJUK BERSIH + TAHUN & CETUS X05 (SELEPAS X06)
      # =========================================================================
      - name: 7a. Dapatkan Tajuk Bersih + Tahun & Picu Enjin Web Scraper (X05)
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          IMDB_INPUT: ${{ inputs.imdb_id }}
          TITLE_INPUT: ${{ inputs.title }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import urllib.request

          imdb_id = os.environ.get("IMDB_INPUT", "").strip()
          raw_title = os.environ.get("TITLE_INPUT", "").strip()
          gh_pat = os.environ.get("GH_PAT", "").strip()
          repo = os.environ.get("REPO_NAME", "").strip()

          base_id = imdb_id.split(":")[0]
          is_series = ":" in imdb_id
          media_type = "series" if is_series else "movie"

          clean_name = ""
          year_val = ""

          # 1. Dapatkan nama rasmi dan tahun daripada Cinemeta
          try:
              url = f"https://v3-cinemeta.strem.io/meta/{media_type}/{base_id}.json"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=8) as resp:
                  if resp.status == 200:
                      data = json.loads(resp.read().decode("utf-8"))
                      meta = data.get("meta", {})
                      clean_name = meta.get("name", "").strip()
                      raw_year = str(meta.get("year", "")).strip()
                      year_val = raw_year.split("–")[0].split("-")[0].strip()
          except Exception as e:
              print(f"⚠️ Cinemeta fetch warning: {e}")

          # 2. Jika Cinemeta kosong, gunakan fallback title
          if not clean_name:
              if raw_title and not re.match(r"^tt\d+", raw_title, re.IGNORECASE):
                  clean_name = raw_title.strip()
              else:
                  clean_name = base_id

          # 3. Bentuk tajuk carian penuh bersama Tahun atau Episod
          if is_series:
              parts = imdb_id.split(":")
              s_num = int(parts[1]) if len(parts) > 1 else 1
              e_num = int(parts[2]) if len(parts) > 2 else 1
              final_search_title = f"{clean_name} S{s_num:02d}E{e_num:02d}"
          else:
              if year_val and year_val not in clean_name:
                  final_search_title = f"{clean_name} {year_val}"
              else:
                  final_search_title = clean_name

          print(f"🎬 IMDb ID        : {imdb_id}")
          print(f"🎯 Tajuk + Tahun  : {final_search_title}")

          # 4. Cetus alur kerja X05_series_web_download.yml
          dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/X05_series_web_download.yml/dispatches"
          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "imdb_id": imdb_id,
                  "title": final_search_title,
                  "force": "false"
              }
          }).encode("utf-8")

          req = urllib.request.Request(
              dispatch_url,
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {gh_pat}",
                  "Content-Type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  if resp.status in [200, 204]:
                      print(f"✅ Alur kerja X05 berjaya dicetuskan: '{final_search_title}'!")
                  else:
                      print(f"⚠️ Status respons GitHub API: {resp.status}")
          except Exception as e:
              print(f"❌ Ralat semasa mencetuskan X05: {e}")
          EOF

      - name: 8. Hantar Notifikasi Senarai Seeder ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_ACCOUNTS_JSON: ${{ secrets.REDIS_ACCOUNTS_JSON }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "list" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}"

      - name: 9. Hantar Notifikasi Ralat ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_engine_v2/03_telegram_notify.py \
            --mode "error" \
            --imdb "${{ inputs.imdb_id }}" \
            --title "${{ inputs.title }}" \
            --workflow "X03_series_seeder_list.yml" \
            --error "Gagal mengekstrak atau menyimpan senarai seeder siri ke Redis."